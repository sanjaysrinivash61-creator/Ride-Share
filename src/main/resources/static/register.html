<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - RideShare</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="logo">RideShare</div>

    <nav>
        <a href="index.html">Home</a>
        <a href="register.html" class="active">Register</a>
        <a href="offer-ride.html">Offer Ride</a>
        <a href="find-rides.html">Find Ride</a>
        <a href="my-rides.html">My Rides</a>
        <a href="requests.html">Requests</a>
    </nav>
</header>

<div class="page-container">

    <div class="form-card">

        <h1>Create Account</h1>
        <p class="subtitle">Register to use RideShare</p>

        <form id="registerForm">

            <label>Name</label>
            <input type="text" id="name" placeholder="Enter your name" required>

            <label>Email</label>
            <input type="email" id="email" placeholder="Enter your email" required>

            <label>Phone</label>
            <input type="text" id="phone" placeholder="Enter phone number" required>

            <button type="submit" class="btn primary">
                Register
            </button>

        </form>

        <div id="registerMessage"></div>

    </div>

</div>

<script src="app.js"></script>

</body>
</html>
