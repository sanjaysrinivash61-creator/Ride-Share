<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offer Ride - RideShare</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="logo">RideShare</div>

    <nav>
        <a href="index.html">Home</a>
        <a href="register.html">Register</a>
        <a href="offer-ride.html" class="active">Offer Ride</a>
        <a href="find-rides.html">Find Ride</a>
        <a href="my-rides.html">My Rides</a>
        <a href="requests.html">Requests</a>
    </nav>
</header>

<div class="page-container">

    <div class="form-card">

        <h1>Offer a Ride</h1>

        <p class="subtitle">
            Share your journey with other users
        </p>

        <form id="rideForm">

            <label>Driver ID</label>
            <input type="number"
                   id="driverId"
                   placeholder="Enter your user ID"
                   required>

            <label>Starting Point</label>
            <input type="text"
                   id="origin"
                   placeholder="Eg: Pollachi"
                   required>

            <label>Destination</label>
            <input type="text"
                   id="destination"
                   placeholder="Eg: Coimbatore"
                   required>

            <label>Departure Time</label>
            <input type="datetime-local"
                   id="departureTime"
                   required>

            <label>Available Seats</label>
            <input type="number"
                   id="seats"
                   min="1"
                   max="8"
                   placeholder="Eg: 3"
                   required>

            <button type="submit" class="btn primary">
                Publish Ride
            </button>

        </form>

        <div id="rideMessage"></div>

    </div>

</div>

<script src="app.js"></script>

</body>
</html>
